name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Smoke tests
        run: python tests/smoke.py

      - name: Build the Windows app
        # One folder rather than one file: a --onefile build unpacks itself to
        # temp on every launch, which is the wrong trade for something that
        # starts with Windows and then sits in the tray.
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ArcaneDock
          --collect-submodules arcanedock
          arcane_dock.pyw

      - name: Package
        run: Compress-Archive -Path dist/ArcaneDock/* -DestinationPath ArcaneDock-windows-x64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Arcane Dock ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ArcaneDock-windows-x64.zip
