name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The app is Windows-only: it talks to the shell, DWM and the desktop
    # icon layer directly, so there is nothing meaningful to test elsewhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q arcanedock

      - name: Smoke tests
        run: python tests/smoke.py
